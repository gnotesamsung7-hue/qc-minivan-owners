name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm install

      - name: Bundle map + Firebase libraries into the app (works offline-first)
        run: |
          mkdir -p www/lib/images
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/lib/
          cp node_modules/leaflet/dist/images/* www/lib/images/
          for f in firebase-app-compat.js firebase-auth-compat.js firebase-database-compat.js; do
            cp "node_modules/firebase/$f" www/lib/ || echo "$f not bundled; app will load it from the CDN"
          done
          ls -la www/lib

      - name: Create Android project
        run: npx cap add android

      - name: Add location, microphone and keep-awake permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <application#' "$M"
          cat "$M"

      - name: Use the QC Minivan Owners logo as the app icon
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/mipmap-$d/*.png $RES/mipmap-$d/
          done
          cp icons/values/ic_launcher_background.xml $RES/values/ic_launcher_background.xml

      - name: Sync web code into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../QC-Minivan-Owners.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QC-Minivan-Owners-apk
          path: QC-Minivan-Owners.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: QC Minivan Owners build ${{ github.run_number }}
          files: QC-Minivan-Owners.apk
